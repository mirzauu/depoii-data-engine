[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "depoii-data-engine"
version = "2.0.0"
description = "Autonomous Data Science & Extraction Engine for Depoii Commercial Roofing Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Depoii Engineering", email = "engineering@depoii.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "httpx>=0.27.2",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.15.2",
    "shapely>=2.0.6",
    "rapidfuzz>=3.9.7",
    "prometheus-client>=0.21.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
