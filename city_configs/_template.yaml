# Depoii Municipal Scraper Configuration Template
# Used by Accela, EnerGov, and Custom Municipal Portal Scrapers

jurisdiction: "Example City, ST"
state: "ST"
county: "Example County"
platform: "accela"                   # "accela" | "energov" | "custom_html"
accela_version: "v21"                # "v7" | "v18" | "v21" | "v24"

portal:
  base_url: "https://aca.example.gov"
  search_path: "/Cap/CapHome.aspx"
  module: "Building"
  sub_type: "Commercial"

disclaimer:
  has_disclaimer: true
  checkbox_selector: "input[type='checkbox'][name*='chkAgree']"
  continue_button: "input[value*='Continue']"

search_form:
  date_start_selector: "input[id*='txtStartDate']"
  date_end_selector: "input[id*='txtEndDate']"
  keyword_selector: "input[id*='txtDescription']"
  search_button: "a[id*='btnNewSearch']"
  date_format: "MM/DD/YYYY"

results:
  table_selector: "table[id*='gdvPermitList']"
  pagination_style: "link_next"      # "link_next" | "infinite_scroll" | "load_more_button"
  next_page_selector: "a[id*='ctl00_next']"
  max_pages: 20

columns:
  permit_number: 1
  record_type: 2
  address: 3
  issue_date: 4
  status: 5

anti_bot:
  has_captcha: false
  has_cloudflare: false
  request_delay_ms: 2000
  max_retries: 3

rate_limit:
  requests_per_minute: 10
  concurrent_sessions: 1
