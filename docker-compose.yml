version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: depoii-postgis
    environment:
      POSTGRES_USER: depoii_user
      POSTGRES_PASSWORD: depoii_password
      POSTGRES_DB: depoii_warehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depoii_user -d depoii_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: depoii-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: depoii-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://depoii_user:depoii_password@postgres:5432/depoii_warehouse
      - SYNC_DATABASE_URL=postgresql://depoii_user:depoii_password@postgres:5432/depoii_warehouse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - API_KEY=depoii-secret-dev-key-2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: depoii-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info -c 4
    volumes:
      - .:/workspace
    environment:
      - DATABASE_URL=postgresql+asyncpg://depoii_user:depoii_password@postgres:5432/depoii_warehouse
      - SYNC_DATABASE_URL=postgresql://depoii_user:depoii_password@postgres:5432/depoii_warehouse
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: depoii-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    volumes:
      - .:/workspace
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
